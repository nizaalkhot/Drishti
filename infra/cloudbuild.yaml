steps:
  # 1. Build Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/drishti/backend:$COMMIT_SHA', '-f', 'infra/Dockerfile', '.']

  # 2. Push Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia-south1-docker.pkg.dev/$PROJECT_ID/drishti/backend:$COMMIT_SHA']

  # 3. Deploy to Cloud Run (asia-south1)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'drishti-core'
      - '--image'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/drishti/backend:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--set-env-vars'
      - 'GCP_PROJECT=$PROJECT_ID,REGION=asia-south1,PUBSUB_TRANSACTIONS_TOPIC=drishti-transaction-events,PUBSUB_ALERTS_TOPIC=drishti-fraud-alerts,PUBSUB_STR_TOPIC=drishti-str-filings,BIGQUERY_DATASET=drishti_fraud_lake,VERTEX_REGION=asia-south1,DATABASE_URL=sqlite+aiosqlite:///./drishti.db'
      # Production Cloud SQL / AlloyDB Socket Integration:
      # To connect to Cloud SQL PostgreSQL/AlloyDB in production, append:
      # - '--add-cloudsql-instances=$PROJECT_ID:asia-south1:drishti-pg-instance'
      # - '--set-env-vars=CLOUD_SQL_CONNECTION_NAME=$PROJECT_ID:asia-south1:drishti-pg-instance,DB_USER=drishti_app,DB_NAME=drishti_db'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/drishti/backend:$COMMIT_SHA'
options:
  logging: CLOUD_LOGGING_ONLY
