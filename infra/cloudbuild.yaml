substitutions:
  _TAG: 'latest'

steps:
  # ==============================================================================
  # 1. Drishti Core & Unified API Engine (Multi-stage Python + React Bundle)
  # ==============================================================================
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/drishti/backend:$_TAG', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/drishti/backend:latest', '-f', 'Dockerfile', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia-south1-docker.pkg.dev/$PROJECT_ID/drishti/backend:$_TAG']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia-south1-docker.pkg.dev/$PROJECT_ID/drishti/backend:latest']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'drishti-core'
      - '--image'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/drishti/backend:$_TAG'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '50'
      - '--concurrency'
      - '80'
      - '--vpc-connector'
      - 'projects/$PROJECT_ID/locations/asia-south1/connectors/drishti-vpc-conn'
      - '--set-env-vars'
      - 'GCP_PROJECT=$PROJECT_ID,REGION=asia-south1,PUBSUB_TRANSACTIONS_TOPIC=drishti-transaction-events,PUBSUB_ALERTS_TOPIC=drishti-fraud-alerts,PUBSUB_STR_TOPIC=drishti-str-filings,BIGQUERY_DATASET=drishti_fraud_lake,VERTEX_REGION=asia-south1'
      - '--service-account'
      - 'drishti-cloudrun-sa@$PROJECT_ID.iam.gserviceaccount.com'
      - '--set-secrets'
      - 'DATABASE_URL=drishti-db-url:latest,REDIS_URL=drishti-redis-url:latest,GEMINI_API_KEY=drishti-gemini-key:latest'

  # ==============================================================================
  # 2. Drishti Dedicated Web UI (Nginx Cloud Run Service)
  # ==============================================================================
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/drishti/frontend:$_TAG', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/drishti/frontend:latest', '-f', 'web/Dockerfile', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia-south1-docker.pkg.dev/$PROJECT_ID/drishti/frontend:$_TAG']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia-south1-docker.pkg.dev/$PROJECT_ID/drishti/frontend:latest']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'drishti-web'
      - '--image'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/drishti/frontend:$_TAG'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '20'
      - '--concurrency'
      - '100'
      - '--set-env-vars'
      - 'VITE_API_BASE=https://drishti-core-518872797698.asia-south1.run.app'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/drishti/backend:$_TAG'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/drishti/backend:latest'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/drishti/frontend:$_TAG'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/drishti/frontend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
