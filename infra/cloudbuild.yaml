steps:
  # 1. Build Production Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/drishti/backend:$COMMIT_SHA', '-f', 'infra/Dockerfile', '.']

  # 2. Push Container to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia-south1-docker.pkg.dev/$PROJECT_ID/drishti/backend:$COMMIT_SHA']

  # 3. Deploy to Google Cloud Run with VPC Connector & Secret Manager
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'drishti-core'
      - '--image'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/drishti/backend:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '50'
      - '--concurrency'
      - '80'
      - '--vpc-connector'
      - 'projects/$PROJECT_ID/locations/asia-south1/connectors/drishti-vpc-conn'
      - '--set-env-vars'
      - 'GCP_PROJECT=$PROJECT_ID,REGION=asia-south1,PUBSUB_TRANSACTIONS_TOPIC=drishti-transaction-events,PUBSUB_ALERTS_TOPIC=drishti-fraud-alerts,PUBSUB_STR_TOPIC=drishti-str-filings,BIGQUERY_DATASET=drishti_fraud_lake,VERTEX_REGION=asia-south1'
      - '--service-account'
      - 'drishti-cloudrun-sa@$PROJECT_ID.iam.gserviceaccount.com'
      - '--set-secrets'
      - 'DATABASE_URL=drishti-db-url:latest,REDIS_URL=drishti-redis-url:latest,GEMINI_API_KEY=drishti-gemini-key:latest'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/drishti/backend:$COMMIT_SHA'
options:
  logging: CLOUD_LOGGING_ONLY
