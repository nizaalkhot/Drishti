<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1020" />
      <stop offset="50%" stop-color="#060911" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background tile -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" />
  <rect width="190" height="190" x="1" y="1" rx="41" fill="none" stroke="rgba(6, 182, 212, 0.35)" stroke-width="1.5" />

  <!-- Outer Hex/Radar ring -->
  <circle cx="96" cy="96" r="68" fill="none" stroke="rgba(6, 182, 212, 0.15)" stroke-dasharray="4 6" stroke-width="1.5" />
  <circle cx="96" cy="96" r="50" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" />

  <!-- Shield Core -->
  <g filter="url(#neonGlow)">
    <path d="M96 32 L142 52 C142 98 122 134 96 154 C70 134 50 98 50 52 Z" 
          fill="url(#shieldGrad)" 
          stroke="#38bdf8" 
          stroke-width="2.5" />
  </g>

  <!-- Eye / Drishti Reticle -->
  <g>
    <!-- Outer Eye Ellipse -->
    <path d="M72 88 Q96 66 120 88 Q96 110 72 88 Z" fill="#04121e" stroke="#38bdf8" stroke-width="2.5" />
    <!-- Pupil / Radar Lens -->
    <circle cx="96" cy="88" r="9" fill="#06b6d4" />
    <circle cx="96" cy="88" r="4" fill="#f8fafc" />
    <!-- Scanning Beam Accent -->
    <path d="M84 88 L108 88" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Accent Nodes -->
  <circle cx="96" cy="132" r="3" fill="#38bdf8" />
  <circle cx="80" cy="122" r="2.5" fill="rgba(56, 189, 248, 0.6)" />
  <circle cx="112" cy="122" r="2.5" fill="rgba(56, 189, 248, 0.6)" />
</svg>
